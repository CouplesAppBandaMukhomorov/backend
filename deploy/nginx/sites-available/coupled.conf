server {
    listen 80;
    listen [::]:80;
    server_name coupled.ru www.coupled.ru api.coupled.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.coupled.ru;
    include snippets/coupled-ssl.conf;

    return 301 https://coupled.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coupled.ru;
    include snippets/coupled-ssl.conf;

    root /var/www/coupled;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.coupled.ru;
    include snippets/coupled-ssl.conf;

    client_max_body_size 10m;

    location ~ ^/(docs|redoc|openapi\.json) {
        auth_basic "Couple API docs";
        auth_basic_user_file /etc/nginx/.htpasswd-docs;
        include snippets/coupled-api-proxy.conf;
    }

    location / {
        include snippets/coupled-api-proxy.conf;
    }
}
